<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="iconGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0d9488" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Logo Icon Container -->
  <g filter="url(#shadow)">
    <rect x="6" y="8" width="44" height="44" rx="14" fill="url(#iconGlow)" />
    <!-- White Medical Cross with Pulse Beat -->
    <path d="M28 17 V24 H21 C19.9 24 19 24.9 19 26 V34 C19 35.1 19.9 36 21 36 H28 V43 C28 44.1 28.9 45 30 45 H36 C37.1 45 38 44.1 38 43 V36 H45 C46.1 36 47 35.1 47 34 V26 C47 24.9 46.1 24 45 24 H38 V17 C38 15.9 37.1 15 36 15 H30 C28.9 15 28 15.9 28 17 Z" fill="white" opacity="0.95" />
    <!-- Heartbeat Pulse Line -->
    <path d="M19 30 H25 L27 24 L31 36 L34 27 L36 31 L38 30 H47" stroke="#047857" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Text Branding -->
  <text x="60" y="38" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
    Care<tspan fill="url(#logoGrad)">Sync</tspan>
  </text>
  <circle cx="218" cy="22" r="3.5" fill="#10b981" />
</svg>
