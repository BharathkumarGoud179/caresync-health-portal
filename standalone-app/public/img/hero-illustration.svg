<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0d9488" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Canvas Card -->
  <rect x="20" y="20" width="560" height="460" rx="28" fill="url(#bgGrad)" />

  <!-- Main Tablet/Dashboard Display -->
  <g filter="url(#softShadow)">
    <rect x="70" y="60" width="460" height="360" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <!-- Header of Tablet -->
    <rect x="70" y="60" width="460" height="48" rx="20" fill="#f8fafc" />
    <circle cx="100" cy="84" r="6" fill="#ef4444" />
    <circle cx="118" cy="84" r="6" fill="#f59e0b" />
    <circle cx="136" cy="84" r="6" fill="#10b981" />
    <rect x="170" y="74" width="180" height="20" rx="10" fill="#e2e8f0" opacity="0.6" />
    
    <!-- Left Column: Patient Reports Timeline -->
    <rect x="90" y="125" width="180" height="85" rx="12" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1.5" />
    <circle cx="115" cy="150" r="14" fill="#0d9488" />
    <path d="M111 150 L114 153 L120 147" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="140" y="140" width="110" height="10" rx="5" fill="#0f766e" />
    <rect x="140" y="156" width="80" height="8" rx="4" fill="#99f6e4" />
    <rect x="140" y="170" width="95" height="6" rx="3" fill="#cbd5e1" />

    <rect x="90" y="222" width="180" height="85" rx="12" fill="#eff6ff" stroke="#dbeafe" stroke-width="1.5" />
    <circle cx="115" cy="247" r="14" fill="#0284c7" />
    <path d="M110 244 H120 M110 248 H118 M110 252 H116" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <rect x="140" y="237" width="100" height="10" rx="5" fill="#0369a1" />
    <rect x="140" y="253" width="75" height="8" rx="4" fill="#bae6fd" />
    <rect x="140" y="267" width="90" height="6" rx="3" fill="#cbd5e1" />

    <rect x="90" y="320" width="180" height="80" rx="12" fill="#fdf4ff" stroke="#f5d0fe" stroke-width="1.5" />
    <circle cx="115" cy="345" r="14" fill="#a855f7" />
    <path d="M115 340 V350 M110 345 H120" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <rect x="140" y="335" width="105" height="10" rx="5" fill="#7e22ce" />
    <rect x="140" y="351" width="80" height="8" rx="4" fill="#e9d5ff" />

    <!-- Right Column: Doctor Care Plan & Live Adherence -->
    <rect x="290" y="125" width="220" height="275" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    
    <!-- Adherence Score Widget -->
    <rect x="305" y="140" width="190" height="65" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
    <text x="320" y="162" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#15803d">ADHERENCE RATE</text>
    <text x="320" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#166534">96.4%</text>
    <circle cx="465" cy="172" r="18" fill="#dcfce7" />
    <path d="M460 172 L463 175 L471 167" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Checklist Items -->
    <rect x="305" y="220" width="190" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
    <circle cx="322" cy="239" r="8" fill="#10b981" />
    <path d="M319 239 L321 241 L325 237" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="338" y="243" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#334155">Amlodipine 5mg (Morning)</text>

    <rect x="305" y="266" width="190" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
    <circle cx="322" cy="285" r="8" fill="#10b981" />
    <path d="M319 285 L321 287 L325 283" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="338" y="289" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#334155">Low-Sodium Diet (Under 2g)</text>

    <rect x="305" y="312" width="190" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="3 3" />
    <circle cx="322" cy="331" r="8" fill="#f1f5f9" stroke="#94a3b8" />
    <text x="338" y="335" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#64748b">Evening BP Check (8:00 PM)</text>

    <rect x="305" y="358" width="190" height="30" rx="8" fill="url(#primaryGrad)" />
    <text x="365" y="377" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Mark Next Done</text>
  </g>

  <!-- Floating Badge 1: Instant Sync -->
  <g filter="url(#cardGlow)">
    <rect x="30" y="90" width="170" height="52" rx="14" fill="#ffffff" stroke="#e2e8f0" />
    <circle cx="56" cy="116" r="14" fill="#0d9488" />
    <path d="M52 116 L55 119 L61 113" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="78" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0f172a">Instant Report Sync</text>
    <text x="78" y="126" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748b">Encrypted Cloud Vault</text>
  </g>

  <!-- Floating Badge 2: Doctor Prescription -->
  <g filter="url(#cardGlow)">
    <rect x="390" y="370" width="180" height="54" rx="14" fill="#ffffff" stroke="#e2e8f0" />
    <circle cx="416" cy="397" r="14" fill="#2563eb" />
    <path d="M412 397 H420 M416 393 V401" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <text x="438" y="393" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0f172a">Doctor Verified Plan</text>
    <text x="438" y="407" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#16a34a">● Active Prescription</text>
  </g>
</svg>
